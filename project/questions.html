<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>AskInClass - Questions</title>
	<style>
		:root {
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: #f6f8fb;
			color: #172033;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: #f6f8fb;
		}

		main {
			width: min(820px, calc(100% - 32px));
			margin: 0 auto;
			padding: 44px 0;
		}

		.header {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: 16px;
			margin-bottom: 20px;
		}

		h1,
		h2,
		p {
			margin-top: 0;
		}

		h1 {
			margin-bottom: 8px;
			font-size: 2rem;
			letter-spacing: 0;
		}

		h2 {
			margin-bottom: 14px;
			font-size: 1.1rem;
			letter-spacing: 0;
		}

		.header p {
			margin-bottom: 0;
		}

		.muted {
			color: #5d667a;
		}

		.panel {
			border: 1px solid #dfe5ef;
			border-radius: 8px;
			background: #ffffff;
			box-shadow: 0 1px 2px rgba(23, 32, 51, 0.05);
			padding: 20px;
		}

		.panel+.panel {
			margin-top: 16px;
		}

		label {
			display: block;
			margin-bottom: 8px;
			font-weight: 700;
		}

		select,
		textarea {
			width: 100%;
			border: 1px solid #cfd7e5;
			border-radius: 8px;
			background: #ffffff;
			color: #172033;
			font: inherit;
			padding: 11px 12px;
		}

		select {
			margin-bottom: 14px;
		}

		textarea {
			min-height: 110px;
			resize: vertical;
		}

		select:focus-visible,
		textarea:focus-visible,
		button:focus-visible {
			outline: 2px solid #175da8;
			outline-offset: 2px;
		}

		button {
			border: 0;
			border-radius: 8px;
			background: #175da8;
			color: #ffffff;
			cursor: pointer;
			font: inherit;
			font-weight: 700;
			padding: 11px 15px;
		}

		button:hover {
			background: #134e8d;
		}

		.button-secondary {
			border: 1px solid #cfd7e5;
			background: #ffffff;
			color: #172033;
		}

		.button-secondary:hover {
			background: #f1f4f9;
		}

		.question-list {
			display: grid;
			gap: 12px;
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.question {
			border-top: 1px solid #edf1f6;
			padding-top: 12px;
		}

		.question:first-child {
			border-top: 0;
			padding-top: 0;
		}

		.question-title {
			margin-bottom: 5px;
			font-weight: 750;
		}

		.question-meta {
			margin-bottom: 0;
			color: #697386;
			font-size: 0.92rem;
		}

		/* Modal */
		.modal {
			width: min(520px, calc(100% - 32px));
			border: 1px solid #dfe5ef;
			border-radius: 12px;
			background: #ffffff;
			color: inherit;
			box-shadow: 0 18px 48px rgba(23, 32, 51, 0.18);
			padding: 0;
		}

		.modal::backdrop {
			background: rgba(23, 32, 51, 0.45);
		}

		.modal[open] {
			animation: modal-in 160ms ease-out;
		}

		.modal[open]::backdrop {
			animation: backdrop-in 160ms ease-out;
		}

		@keyframes modal-in {
			from {
				opacity: 0;
				transform: translateY(8px) scale(0.98);
			}
		}

		@keyframes backdrop-in {
			from {
				opacity: 0;
			}
		}

		@media (prefers-reduced-motion: reduce) {

			.modal[open],
			.modal[open]::backdrop {
				animation: none;
			}
		}

		.modal-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			border-bottom: 1px solid #edf1f6;
			padding: 18px 20px;
		}

		.modal-header h2 {
			margin-bottom: 0;
		}

		.modal-close {
			display: grid;
			place-items: center;
			width: 32px;
			height: 32px;
			border-radius: 8px;
			background: transparent;
			color: #5d667a;
			font-size: 1.1rem;
			line-height: 1;
			padding: 0;
		}

		.modal-close:hover {
			background: #f1f4f9;
			color: #172033;
		}

		.modal-body {
			padding: 20px;
		}

		.modal-body label:not(:first-child) {
			margin-top: 14px;
		}

		.modal-footer {
			display: flex;
			justify-content: flex-end;
			gap: 10px;
			border-top: 1px solid #edf1f6;
			padding: 16px 20px;
		}

		@media (max-width: 620px) {
			main {
				width: min(100% - 24px, 820px);
				padding: 32px 0;
			}

			.header {
				flex-direction: column;
				align-items: stretch;
			}

			.header button {
				width: 100%;
			}

			.modal-footer {
				flex-direction: column-reverse;
			}

			.modal-footer button {
				width: 100%;
			}
		}
	</style>
</head>

<body>
	<main>
		<header class="header">
			<div>
				<h1>Ask a Question</h1>
				<p class="muted">Send a question to your professor during class.</p>
			</div>
			<button type="button" id="open-modal">New Question</button>
		</header>

		<section class="panel" aria-labelledby="recent-heading">
			<h2 id="recent-heading">Recent Questions</h2>
			<ul class="question-list" id="question-list">
				<li class="question">
					<p class="question-title">Can you explain recursion one more time?</p>
					<p class="question-meta">CS 101 · asked 3 minutes ago</p>
				</li>
				<li class="question">
					<p class="question-title">Will today's examples be posted after class?</p>
					<p class="question-meta">CS 101 · asked 8 minutes ago</p>
				</li>
			</ul>
		</section>
	</main>

	<dialog class="modal" id="question-modal" aria-labelledby="modal-heading">
		<form method="dialog" id="question-form">
			<div class="modal-header">
				<h2 id="modal-heading">New Question</h2>
				<button type="button" class="modal-close" id="close-modal" aria-label="Close">&times;</button>
			</div>

			<div class="modal-body">
				<label for="class-select">Class</label>
				<select id="class-select" name="class">
					<option>CS 101</option>
					<option>MATH 240</option>
				</select>

				<label for="question">Question</label>
				<textarea id="question" name="question" placeholder="Type your question here" required></textarea>
			</div>

			<div class="modal-footer">
				<button type="button" class="button-secondary" id="cancel-modal">Cancel</button>
				<button type="submit" value="submit">Submit Question</button>
			</div>
		</form>
	</dialog>

	<script>
		const modal = document.getElementById('question-modal');
		const form = document.getElementById('question-form');
		const list = document.getElementById('question-list');
		const questionField = document.getElementById('question');

		document.getElementById('open-modal').addEventListener('click', () => {
			modal.showModal();
			questionField.focus();
		});

		const close = () => modal.close();
		document.getElementById('close-modal').addEventListener('click', close);
		document.getElementById('cancel-modal').addEventListener('click', close);

		// Clicking the backdrop closes the dialog.
		modal.addEventListener('click', (event) => {
			if (event.target === modal) {
				close();
			}
		});

		form.addEventListener('submit', () => {
			const text = questionField.value.trim();
			if (!text) {
				return;
			}

			const item = document.createElement('li');
			item.className = 'question';
			item.innerHTML = '<p class="question-title"></p><p class="question-meta"></p>';
			item.querySelector('.question-title').textContent = text;
			item.querySelector('.question-meta').textContent =
				document.getElementById('class-select').value + ' · asked just now';
			list.prepend(item);
		});

		modal.addEventListener('close', () => form.reset());
	</script>
</body>

</html>
