<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>AskInClass - Questions</title>
	<style>
		:root {
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: #f6f8fb;
			color: #172033;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: #f6f8fb;
		}

		main {
			width: min(820px, calc(100% - 32px));
			margin: 0 auto;
			padding: 44px 0;
		}

		.breadcrumbs {
			margin-bottom: 18px;
		}

		.breadcrumbs ol {
			display: flex;
			gap: 8px;
			align-items: center;
			margin: 0;
			padding: 0;
			color: #697386;
			font-size: 0.84rem;
			list-style: none;
		}

		.breadcrumbs li {
			display: inline-flex;
			gap: 8px;
			align-items: center;
		}

		.breadcrumbs li + li::before {
			color: #a7afbd;
			content: "/";
		}

		.breadcrumbs a {
			border-radius: 4px;
			color: #175da8;
			font-weight: 650;
			text-decoration: none;
		}

		.breadcrumbs a:hover {
			text-decoration: underline;
		}

		.breadcrumbs a:focus-visible {
			outline: 3px solid #b8d9fa;
			outline-offset: 3px;
		}

		.breadcrumbs [aria-current="page"] {
			color: #46536a;
			font-weight: 700;
		}

		.header {
			margin-bottom: 20px;
		}

		h1,
		h2,
		p {
			margin-top: 0;
		}

		h1 {
			margin-bottom: 8px;
			font-size: 2rem;
			letter-spacing: 0;
		}

		h2 {
			margin-bottom: 14px;
			font-size: 1.1rem;
			letter-spacing: 0;
		}

		.muted {
			color: #5d667a;
		}

		.panel {
			border: 1px solid #dfe5ef;
			border-radius: 8px;
			background: #ffffff;
			box-shadow: 0 1px 2px rgba(23, 32, 51, 0.05);
			padding: 20px;
		}

		.panel + .panel {
			margin-top: 16px;
		}

		label {
			display: block;
			margin-bottom: 8px;
			font-weight: 700;
		}

		select,
		textarea {
			width: 100%;
			border: 1px solid #cfd7e5;
			border-radius: 8px;
			background: #ffffff;
			color: #172033;
			font: inherit;
			padding: 11px 12px;
		}

		select {
			margin-bottom: 14px;
		}

		textarea {
			min-height: 110px;
			resize: vertical;
		}

		button {
			margin-top: 14px;
			border: 0;
			border-radius: 8px;
			background: #175da8;
			box-shadow: 0 2px 5px rgba(23, 93, 168, 0.18);
			color: #ffffff;
			cursor: pointer;
			font: inherit;
			font-weight: 700;
			padding: 11px 15px;
			transition: background-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
		}

		button:hover {
			background: #124f90;
			box-shadow: 0 5px 12px rgba(23, 93, 168, 0.24);
			transform: translateY(-1px);
		}

		button:active {
			box-shadow: 0 1px 3px rgba(23, 93, 168, 0.18);
			transform: translateY(0);
		}

		@media (prefers-reduced-motion: reduce) {
			button {
				transition: none;
			}
		}

		.submit-button {
			display: inline-flex;
			gap: 9px;
			align-items: center;
			justify-content: center;
		}

		.submit-arrow {
			font-size: 1rem;
			line-height: 1;
			transition: transform 150ms ease;
		}

		.submit-button:hover .submit-arrow {
			transform: translateX(3px);
		}

		.question-list {
			display: grid;
			gap: 12px;
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.question {
			border-top: 1px solid #edf1f6;
			padding-top: 12px;
		}

		.question:first-child {
			border-top: 0;
			padding-top: 0;
		}

		.question-title {
			margin-bottom: 5px;
			font-weight: 750;
		}

		.question-meta {
			margin-bottom: 0;
			color: #697386;
			font-size: 0.92rem;
		}

		@media (max-width: 620px) {
			main {
				width: min(100% - 24px, 820px);
				padding: 32px 0;
			}

			.submit-button {
				width: 100%;
			}
		}

		.question {
			cursor: pointer;
		}

		.modal-overlay {
			display: none;
			position: fixed;
			inset: 0;
			align-items: center;
			justify-content: center;
			background: rgba(23, 32, 51, 0.45);
			padding: 16px;
		}

		.modal-overlay.open {
			display: flex;
		}

		.modal {
			width: min(380px, 100%);
			border-radius: 10px;
			background: #ffffff;
			box-shadow: 0 12px 32px rgba(23, 32, 51, 0.2);
			padding: 22px;
		}

		.modal h2 {
			font-size: 1.15rem;
		}

		.modal p {
			color: #5d667a;
		}

		.modal-actions {
			display: flex;
			justify-content: flex-end;
			margin-top: 18px;
		}

		.modal-actions button {
			margin-top: 0;
		}
	</style>
</head>
<body>
	<main>
		<nav class="breadcrumbs" aria-label="Breadcrumb">
			<ol>
				<li><a href="/classes">Classes</a></li>
				<li><a href="/classes/cs-101">CS 101</a></li>
				<li aria-current="page">Questions</li>
			</ol>
		</nav>

		<header class="header">
			<h1>Ask a Question</h1>
			<p class="muted">Send a question to your professor during class.</p>
		</header>

		<section class="panel" aria-labelledby="ask-heading">
			<h2 id="ask-heading">New Question</h2>
			<form>
				<label for="class-select">Class</label>
				<select id="class-select" name="class">
					<option>CS 101</option>
					<option>MATH 240</option>
				</select>

				<label for="question">Question</label>
				<textarea id="question" name="question" placeholder="Type your question here"></textarea>

				<button class="submit-button" type="button">Submit Question <span class="submit-arrow" aria-hidden="true">→</span></button>
			</form>
		</section>

		<section class="panel" aria-labelledby="recent-heading">
			<h2 id="recent-heading">Recent Questions</h2>
			<ul class="question-list">
				<li class="question" data-title="Can you explain recursion one more time?" data-meta="CS 101 · asked 3 minutes ago">
					<p class="question-title">Can you explain recursion one more time?</p>
					<p class="question-meta">CS 101 · asked 3 minutes ago</p>
				</li>
				<li class="question" data-title="Will today's examples be posted after class?" data-meta="CS 101 · asked 8 minutes ago">
					<p class="question-title">Will today's examples be posted after class?</p>
					<p class="question-meta">CS 101 · asked 8 minutes ago</p>
				</li>
			</ul>
		</section>
	</main>

	<div class="modal-overlay" id="question-modal-overlay">
		<div class="modal" role="dialog" aria-modal="true" aria-labelledby="question-modal-heading">
			<h2 id="question-modal-heading"></h2>
			<p id="question-modal-meta"></p>
			<div class="modal-actions">
				<button type="button" id="question-modal-close">Close</button>
			</div>
		</div>
	</div>

	<script>
		const questionModalOverlay = document.querySelector("#question-modal-overlay");
		const questionModalHeading = document.querySelector("#question-modal-heading");
		const questionModalMeta = document.querySelector("#question-modal-meta");

		document.querySelectorAll(".question").forEach((item) => {
			item.addEventListener("click", () => {
				questionModalHeading.textContent = item.dataset.title;
				questionModalMeta.textContent = item.dataset.meta;
				questionModalOverlay.classList.add("open");
			});
		});

		document.querySelector("#question-modal-close").addEventListener("click", () => {
			questionModalOverlay.classList.remove("open");
		});
	</script>
</body>
</html>
